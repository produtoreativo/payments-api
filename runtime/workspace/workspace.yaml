  # ── Phase ─────────────────────────────────────────────────────────────────
  - name: "phase:bootstrap"
    color: "bfd4f2"
    description: "Fase Bootstrap"
    category: phase

  - name: "phase:hack"
    color: "bfd4f2"
    description: "Fase Hack"
    category: phase

  - name: "phase:sync"
    color: "bfd4f2"
    description: "Fase Sync"
    category: phase

  - name: "phase:finish"
