views:
  # ── Delivery — IP-RUNTIME-001 ─────────────────────────────────────────────
  # Source: prodops/scripts/diligence/ensure-delivery-views.sh
  #
  # Field name convention: workspace.yaml uses ':' as namespace separator.
  # GitHub Projects v2 sanitizes ':' to space — filters reference sanitized names.
  #   oem:journey     → "oem journey"     in filters: "oem journey":Delivery
  #   oem:state       → "oem state"       in filters: "oem state":BLOCKED
  #   witem:iteration → "witem iteration" in filters: "witem iteration":IP-RUNTIME-001
  #
  # Filter native qualifiers (GitHub issue fields — NOT our custom fields):
  #   state:open / state:closed  → native issue state (open/closed)
  #   label:name                 → label filter (unambiguous)
  #
  # groupBy is NOT settable via REST API or GraphQL mutation.
  # Configure manually in GitHub UI after provisioning:
  #   https://github.com/orgs/produtoreativo/projects/24

  - name: "Iteration Backlog"
    layout: TABLE
    description: >
      Work Items da Iteration IP-RUNTIME-001 em sequência de execução.
      Agrupa por oem:state para visualizar progresso dentro da iteration.
    filter: '"witem iteration":IP-RUNTIME-001'
    groupBy: "oem:state"

  - name: "Delivery Board"
    layout: BOARD
    description: >
      Board de CI Sync — Features da Delivery Journey na Iteration IP-RUNTIME-001.
      Colunas por oem:state: BOOTSTRAPPING → HACKING → SYNCING → FINISHING → SHIPPING → VALIDATING → PROMOTING → DONE.
    filter: '"oem journey":Delivery "witem iteration":IP-RUNTIME-001'
    groupBy: "oem:state"

  - name: "Delivery Blocked"
    layout: TABLE
    description: >
      Features com Impediment ativo (oem:state = BLOCKED).
      Agrupa por witem:feature para identificar quais features estão bloqueadas.
    filter: '"oem journey":Delivery "witem iteration":IP-RUNTIME-001 "oem state":BLOCKED'
    groupBy: "witem:feature"

  - name: "Delivery Done"
    layout: TABLE
    description: >
      Features concluídas (oem:state = DONE) — evidência de conclusão da iteration.
      Agrupa por oem:state (todos DONE) como registro imutável.
    filter: '"oem journey":Delivery "witem iteration":IP-RUNTIME-001 "oem state":DONE'
    groupBy: "oem:state"

issues:
  # ── Épica ──────────────────────────────────────────────────────────────────
  - title: "EPIC: ProdOps Runtime MVP"
    body: |
      Executar o piloto completo de validação do Runtime do ProdOps Framework no payments-api.

      **Experimento:** EXP-013
      **Iteration:** IP-RUNTIME-001
      **Release:** v0.1.0-runtime-pilot
    labels: ["runtime:pilot", "journey:delivery"]
    type: "Feature"
    feature: "EPIC-RUNTIME-001"
    initialFields:
      oem:journey: "Delivery"
      oem:state: "BOOTSTRAPPING"
      diligence:evidence: "Missing"
      runtime:sync: "Pending"
      runtime:timeline-state: "Empty"

  # ── Features ───────────────────────────────────────────────────────────────
  - title: "FTR-RUNTIME-001: Split Payment Creation — Happy Path"
    body: |
      Executar o ciclo completo de Delivery para Split Payment Creation sem interrupções.

      **Cenário:** Happy Path — Bootstrap → Promote sem Gate.Failed nem Impediment
      **Responde:** Q1 (OEM), Q2 (Derived State), Q3 (Replay)

      **Critérios de aceite:**
      - Feature em estado DONE ao final
      - 15 eventos registrados na Timeline
      - Derived State correto em cada transição
      - GitHub COR sincronizado (oem:state = DONE)
    labels: ["runtime:pilot", "journey:delivery", "phase:bootstrap", "evidence:missing"]
    type: "Feature"
    feature: "FTR-RUNTIME-001"
    initialFields:
      oem:journey: "Delivery"
      oem:state: "BOOTSTRAPPING"
      diligence:evidence: "Missing"
      runtime:sync: "Pending"
      runtime:timeline-state: "Empty"

  - title: "FTR-RUNTIME-002: Split Allocation Validation — Gate Failed + Rework"
    body: |
      Executar Delivery Journey com Gate.Failed durante VALIDATING e ciclo de Rework completo.

      **Cenário:** Gate Failed → Rework.Declared → Rework.Completed → Gate.Passed
      **Responde:** Q1 (Rework events), Q2 (REWORKING state)

      **Critérios de aceite:**
      - Shared.Gate.Failed registrado
      - Delivery.Rework.Declared → REWORKING state
      - Delivery.Rework.Completed → retorno a VALIDATING
      - oem:rework-count = 1 ao final
    labels: ["runtime:pilot", "journey:delivery", "runtime:rework", "evidence:missing"]
    type: "Feature"
    feature: "FTR-RUNTIME-002"
    initialFields:
      oem:journey: "Delivery"
      oem:state: "BOOTSTRAPPING"
      diligence:evidence: "Missing"
      runtime:sync: "Pending"
      runtime:timeline-state: "Empty"

  - title: "FTR-RUNTIME-003: Settlement Webhook Notification — Blocking + Drift"
    body: |
      Executar Delivery com Blocking via Impediment.Declared + Lookback + Diligence Async com Drift.

      **Cenário:** HACKING → BLOCKED → Lookback → HACKING → DONE + Drift detectado e reparado
      **Responde:** Q2 (Lookback), Q4 (COR), Q5 (Diligence), Q7 (Shared Types)

      **Critérios de aceite:**
      - Impediment.Declared → BLOCKED
      - Impediment.Resolved (alters_state: false) com Lookback → HACKING
      - Drift introduzido e reparado pela Diligence Async
    labels: ["runtime:pilot", "journey:delivery", "runtime:blocked", "journey:diligence", "evidence:missing"]
    type: "Feature"
    feature: "FTR-RUNTIME-003"
    initialFields:
      oem:journey: "Delivery"
      oem:state: "BOOTSTRAPPING"
      diligence:evidence: "Missing"
      runtime:sync: "Pending"
      runtime:timeline-state: "Empty"

  # ── Runtime Tasks ──────────────────────────────────────────────────────────
  - title: "RT-01: Event Producer"
    body: |
      Mecanismo de emissão de Event Instances em formato canônico (OEM).

      **DoD:** Schema validado; primeiro evento emitido; arquivo em evidence/timelines/
    labels: ["runtime:pilot", "runtime:task"]
    type: "Runtime Task"
    feature: "RT-01"
    initialFields:
      oem:journey: "Delivery"
      runtime:sync: "Pending"

  - title: "RT-02: Timeline Processor"
    body: |
      Consumer que calcula Derived State a partir da Timeline, incluindo algoritmo de Lookback.

      **DoD:** Derived State correto para FTR-001; Replay idempotente; Lookback para FTR-003
    labels: ["runtime:pilot", "runtime:task"]
    type: "Runtime Task"
    feature: "RT-02"
    initialFields:
      oem:journey: "Delivery"
      runtime:sync: "Pending"

  - title: "RT-03: GitHub Synchronizer"
    body: |
      Atualiza Custom Fields do GitHub Project com Derived State calculado pelo Timeline Processor.

      **DoD:** oem:state sincronizado após cada transição; oem:rework-count e oem:blocked-since corretos
    labels: ["runtime:pilot", "runtime:task"]
    type: "Runtime Task"
    feature: "RT-03"
    initialFields:
      oem:journey: "Delivery"
      runtime:sync: "Pending"

  - title: "RT-04: Datadog Integration"
    body: |
      Envia métricas derivadas da Timeline para Datadog via API.

      **DoD:** Primeira métrica (events_emitted) visível no Datadog com trace até evento da Timeline
    labels: ["runtime:pilot", "runtime:task"]
    type: "Runtime Task"
    feature: "RT-04"
    initialFields:
      oem:journey: "Delivery"
      runtime:sync: "Pending"

  - title: "RT-05: Delivery Dashboard"
    body: |
      Dashboard Datadog com Lead Time, Cycle Time, Block Time, Gate Failure Rate.

      **DoD:** Dashboard com pelo menos Lead Time e Gate Failure Rate; screenshots em evidence/
    labels: ["runtime:pilot", "runtime:task"]
    type: "Runtime Task"
    feature: "RT-05"
    initialFields:
      oem:journey: "Delivery"
      runtime:sync: "Pending"

  - title: "RT-06: Diligence Dashboard"
    body: |
      Dashboard Datadog com Drift Detection Rate e Repair Time.

      **DoD:** Dashboard com pelo menos Drift Detection Rate; screenshots em evidence/
    labels: ["runtime:pilot", "runtime:task"]
    type: "Runtime Task"
    feature: "RT-06"
    initialFields:
      oem:journey: "Diligence"
      runtime:sync: "Pending"
