metadata:
  owner: "produtoreativo"
  repository: "payments-api"
  iteration: "IP-RUNTIME-001"
  release: "v0.1.0-runtime-pilot"
  obc: "EXP-013"

project:
  title: "ProdOps — payments-api"
  description: >
    Canonical Operational Representation do ProdOps Runtime no payments-api.
    Espelho de Derived State calculado a partir da Operational Timeline — não é fonte de verdade.

milestone:
  title: "v0.1.0-runtime-pilot"
  description: >
    Runtime Validation Pilot — EXP-013.
    Agrupa Features, Runtime Tasks e Findings da Iteration IP-RUNTIME-001.

fields:
  # ── Identity ─────────────────────────────────────────────────────────────
  - name: "witem:type"
    type: SINGLE_SELECT
    options: ["Feature", "Runtime Task", "Finding"]
    required: true
    updatedBy: manual

  - name: "witem:repository"
    type: TEXT
    required: true
    updatedBy: manual

  - name: "witem:feature"
    type: TEXT
    required: true
    updatedBy: manual

  - name: "witem:obc"
    type: TEXT
    required: true
    updatedBy: manual

  - name: "witem:release"
    type: TEXT
    required: true
    updatedBy: manual

  - name: "witem:iteration"
    type: TEXT
    required: true
    updatedBy: manual

  # ── Delivery ──────────────────────────────────────────────────────────────
  - name: "oem:journey"
    type: SINGLE_SELECT
    options: ["Delivery", "Diligence", "Assessment"]
    required: true
    updatedBy: manual

  - name: "oem:cycle"
    type: SINGLE_SELECT
    options: ["Bootstrap", "Hack", "Sync", "Finish", "Ship", "Validate", "Promote", "Rework"]
    required: false
    updatedBy: both

  - name: "oem:phase"
    type: SINGLE_SELECT
    options: ["Started", "Completed"]
    required: false
    updatedBy: both

  - name: "oem:state"
    type: SINGLE_SELECT
    options: ["BOOTSTRAPPING", "HACKING", "SYNCING", "FINISHING", "SHIPPING", "VALIDATING", "PROMOTING", "DONE", "BLOCKED", "REWORKING"]
    required: true
    updatedBy: runtime

  - name: "oem:rework-count"
    type: NUMBER
    required: false
    updatedBy: runtime

  - name: "oem:blocked-since"
    type: DATE
    required: false
    updatedBy: runtime

  # ── Diligence ─────────────────────────────────────────────────────────────
  - name: "diligence:status"
    type: SINGLE_SELECT
    options: ["Pending", "Sync In Progress", "Async In Progress", "Compliant", "Non-Compliant"]
    required: true
    updatedBy: runtime

  - name: "diligence:evidence"
    type: SINGLE_SELECT
    options: ["Missing", "Partial", "Complete"]
    required: true
    updatedBy: manual

  # ── Runtime ───────────────────────────────────────────────────────────────
  - name: "runtime:sync"
    type: SINGLE_SELECT
    options: ["Pending", "In Sync", "Drift Detected", "Repair In Progress", "Reconciled"]
    required: true
    updatedBy: runtime

  - name: "runtime:timeline-state"
    type: SINGLE_SELECT
    options: ["Empty", "In Progress", "Complete", "Replay Verified"]
    required: true
    updatedBy: manual

  - name: "oem:last-event"
    type: TEXT
    required: true
    updatedBy: runtime

  - name: "runtime:last-sync"
    type: DATE
    required: false
    updatedBy: runtime

