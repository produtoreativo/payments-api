name: PR Quality Gates

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline structure
#
#  lint ─┐
#  acceptance ─┤
#  build ─┼─► (all parallel — no needs: chains, fast feedback)
#  dependencies ─┤
#  no_mocks ─┤
#  prodops_consistency ─┘
#
#  Each job mirrors a gate defined in prodops/exec/manifest.yaml (gates:).
#  Job names match the manifest keys so the mapping is obvious:
#
#  lint                 gates.lint       — ESLint over api sources, no errors
#                                          (same criterion as the manifest gate).
#  acceptance           gates.acceptance — e2e acceptance suites against
#                                          LocalStack; the repo has no unit
#                                          suites, so this is the test gate.
#  build                gates.build      — NestJS production build compiles.
#  dependencies         gates.dependencies — SCA (Snyk) over api deps. AUTO-MERGE
#                                          gate, not a required check: advisory
#                                          here (continue-on-error), enforced by
#                                          `finish request`. Skips without
#                                          SNYK_TOKEN.
#  no_mocks             gates.no_mocks   — No Mocks Rule: forbidden jest mock
#                                          patterns must not appear in api/src or
#                                          api/test. Source of the rule:
#                                          prodops/skills/hack/references/workflow.md
#  prodops_consistency  manifest drift   — prose docs must reference (not rewrite)
#                                          manifest values; doctor is advisory.
#
#  The `smoke` gate from the manifest is conditional (bootstrap) and covered
#  by staging-deploy.yml — it is intentionally not part of the per-PR gates.
#
#  Implements the layered automated PR review baseline (issue #5,
#  PROJECT-REVIEW.md §8.2.4).
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # push (any branch) runs the same gates as a PR and establishes the coverage
  # baseline for that branch, so a PR targeting it can be compared. Running the
  # full gate set — not just acceptance — means the baseline always comes from a
  # lint/build/no_mocks-verified state, mirroring the local /finish validate
  # step. Keeping this unfiltered — instead of pinning to master — matches the
  # ProdOps flow where a feature branch is derived from an arbitrary origin
  # branch, and that origin branch is the PR target that needs a baseline.
  push:

permissions:
  contents: read

# One run per ref; new pushes cancel the previous run. On pull_request the ref
# is the PR head; on push it is the pushed branch. Falling back to run_id keeps
# the group unique when neither is present.
concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Gate: lint ──────────────────────────────────────────────────────────────
  # Manifest: gates.lint ("cd api && npm run lint", expect exit0).
  # `npm run lint` uses --fix, which rewrites files instead of failing — useless
  # as a CI gate. We run eslint directly with the SAME glob pattern as the
  # package.json lint script but WITHOUT --fix: errors fail the job, warnings
  # do not — the same criterion the manifest gate expresses (exit 0). The
  # codebase carries 15 pre-existing warnings; tightening to --max-warnings 0
  # is a separate cleanup, not a gate decision.
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  # ── Gate: acceptance ────────────────────────────────────────────────────────
  # Manifest: gates.acceptance. The repo has no unit suites (jest on api/src
  # finds 0 tests); the acceptance e2e suites are the test gate. They need
  # LocalStack — the app fixture provisions DynamoDB tables even with the
  # in-memory repository — so this mirrors staging-deploy.yml's service
  # container pattern.
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # code-quality: write lets the coverage upload step publish the Cobertura
    # report to GitHub Code Quality. Scoped to this job — the other gates keep
    # the workflow-wide read-only default.
    permissions:
      contents: read
      code-quality: write

    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,sqs
          DEBUG: '0'
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12

    env:
      NODE_ENV: test
      INVOICE_REPOSITORY: memory
      ENABLED_PAYMENT_PROVIDERS: ASAAS
      DEFAULT_PAYMENT_PROVIDER: ASAAS
      ASAAS_MOCK: 'true'
      AWS_DYNAMODB_ENDPOINT: http://localhost:4566
      AWS_SQS_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # test:acceptance uses test/jest-e2e.json, which now collects coverage
      # over src/ (instrumented while the e2e suites run) and emits a Cobertura
      # XML at api/coverage/cobertura-coverage.xml. There are no unit suites on
      # api/src, so the acceptance run is the source of coverage.
      - name: Acceptance tests
        run: npm run test:acceptance

      # Publishes the Cobertura report to GitHub Code Quality (public preview).
      # The action resolves a pull_request_number from the event, and the server
      # only accepts an upload WITHOUT one on the default branch — a push to any
      # other branch with no open PR is rejected with HTTP 400 ("Only default
      # branch is allowed if no pull_request_number is provided"). So the two
      # valid cases are:
      #   • push to master        → publishes the default-branch BASELINE.
      #   • pull_request (non-fork) → attaches the PR's coverage, compared
      #     against that baseline. Fork PRs lack code-quality:write, so they are
      #     excluded (the action would otherwise exit with a notice anyway).
      # A push to a feature branch before its PR exists is intentionally NOT
      # uploaded — it has no PR to attach to and is not the default branch.
      # fail-on-error: false keeps any residual rejection advisory rather than
      # failing the acceptance gate. Informative for now — no threshold blocks
      # the merge. Requires Code Quality enabled on the repo/org; otherwise the
      # summary simply does not render.
      - name: Upload coverage report
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: api/coverage/cobertura-coverage.xml
          language: typescript
          label: acceptance
          fail-on-error: false

  # ── Gate: build ─────────────────────────────────────────────────────────────
  # Manifest: gates.build ("cd api && npm run build", expect exit0).
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Gate: dependencies (SCA / Snyk) ─────────────────────────────────────────
  # Manifest: gates.dependencies. SCA over api/ third-party deps — it does not
  # look at source code. Source code is covered by gates.code-analysis
  # (local SonarQube) and, in CI, by CodeQL (remote SAST). This mirrors
  # gates.coverage: it is an AUTO-MERGE gate, not a required status check, so it
  # does not block manual merge. continue-on-error keeps a red scan from failing
  # the workflow — the enforcement point is `finish request`, which does not arm
  # auto-merge when ./scripts/check-dependencies.sh exits non-zero.
  # Needs SNYK_TOKEN; without it the step skips (the script exits 2 = "gate could
  # not run"), advisory here, and auto-merge stays disarmed with the reason on
  # the PR. Creating the secret is an admin action, like allow_auto_merge.
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The gate script reads the severity threshold from the manifest and
      # translates snyk's exit codes into the auto-merge verdict. Run from the
      # repo root so its REPO_ROOT/api resolution matches local execution.
      - name: Dependency scan (SCA)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: ../scripts/check-dependencies.sh

  # ── Gate: no_mocks ──────────────────────────────────────────────────────────
  # Manifest: gates.no_mocks (forbidden patterns in api/test only,
  # expect zero_hits). Enforces the No Mocks Rule:
  # prodops/skills/hack/references/workflow.md
  # Fixed-string grep (-F) — the patterns contain "." and "(" that must match
  # literally. Zero hits = pass; any hit fails and is printed.
  no_mocks:
    name: no_mocks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden mock patterns
        run: |
          # Patterns from prodops/exec/manifest.yaml (gates.no_mocks.grep)
          HITS=$(grep -rFn \
            -e 'jest.fn(' \
            -e '.mockReturnValue(' \
            -e '.overrideProvider(' \
            -e 'jest.mock(' \
            api/test || true)

          if [ -n "$HITS" ]; then
            echo "FAIL: forbidden mock patterns found (No Mocks Rule)."
            echo "See prodops/skills/hack/references/workflow.md — tests must"
            echo "exercise real implementations (in-memory repository, ASAAS_MOCK)."
            echo ""
            echo "$HITS"
            exit 1
          fi
          echo "PASS: no forbidden mock patterns in api/test."

  # ── Gate: prodops_consistency ───────────────────────────────────────────────
  # Validates the repo against prodops/exec/manifest.yaml (prose docs must
  # reference manifest values, not rewrite them), confirms the materialized
  # per-player skills match their source, and runs the repo doctor.
  prodops_consistency:
    name: prodops_consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate exec manifest
        run: ./prodops/scripts/validate-manifest.sh

      # prodops/skills/ is the source; .claude/, .agents/ and .github/ are
      # generated copies that the agents actually read. An edit to the source
      # that is never materialized is INERT — the agents keep reading the stale
      # copy, so a fixed skill still behaves as if unfixed. That failure is
      # invisible locally (the source looks right) and only shows up when
      # another player runs the skill, which is why it belongs in CI.
      # --check writes nothing and exits 1 on any drift or divergence.
      - name: Skills materialized from source
        run: ./prodops/scripts/agents/materialize-skills.sh --check

      # Advisory for now: doctor gets stricter on a sibling branch and the
      # fixes it flags land in separate branches. Flip to blocking once the
      # fix branches are merged.
      - name: ProdOps doctor (advisory)
        continue-on-error: true
        run: ./prodops/scripts/doctor.sh
