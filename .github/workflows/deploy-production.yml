name: Deploy to Production

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline structure
#
#  deploy-production ──► smoke-test
#
#  deploy-production  Manual-only trigger with required reviewer gate.
#                     Deploys to REAL AWS production infrastructure.
#                     Asaas live API (not sandbox). confirm_changeset=false
#                     here because the GitHub Environment protection rule is
#                     the human gate — no need to double-gate inside sam deploy.
#
#  smoke-test         Calls the live production endpoint after deploy to
#                     confirm the API is reachable and auth guard is active.
#
# Required GitHub setup (one-time):
#   Settings → Environments → production → Required reviewers: [list]
#   Settings → Environments → production → Secrets:
#     PRODUCTION_ASAAS_TOKEN
#     PRODUCTION_ASAAS_WEBHOOK_TOKEN
#     PRODUCTION_ADMIN_SECRET
#     PRODUCTION_DATADOG_API_KEY
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for this production deploy"
        required: true
        type: string

# Only one production deploy at a time. Never cancel mid-deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# id-token: write is required for OIDC keyless AWS authentication.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DYNAMO_STACK: payments-api-dynamo-production
  LAMBDA_STACK: payments-api-production
  ENVIRONMENT: production

jobs:
  # ── Deploy to Production ────────────────────────────────────────────────────
  # Requires manual approval via GitHub Environment protection rules.
  # This job will not start until a required reviewer approves it.
  deploy-production:
    name: Deploy — Real AWS Infrastructure (Production)
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ steps.get-url.outputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build
        working-directory: api
        run: |
          npm run build
          cp package.json package-lock.json dist/
          npm ci --omit=dev --prefix dist

      # ── Validate required secrets are present ───────────────────────────────
      - name: Validate required secrets
        env:
          ASAAS_TOKEN: ${{ secrets.PRODUCTION_ASAAS_TOKEN }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.PRODUCTION_ASAAS_WEBHOOK_TOKEN }}
          ADMIN_SECRET: ${{ secrets.PRODUCTION_ADMIN_SECRET }}
          DATADOG_API_KEY: ${{ secrets.PRODUCTION_DATADOG_API_KEY }}
        run: |
          MISSING=()
          [[ -z "$ASAAS_TOKEN" ]]        && MISSING+=("PRODUCTION_ASAAS_TOKEN")
          [[ -z "$ASAAS_WEBHOOK_TOKEN" ]] && MISSING+=("PRODUCTION_ASAAS_WEBHOOK_TOKEN")
          [[ -z "$ADMIN_SECRET" ]]        && MISSING+=("PRODUCTION_ADMIN_SECRET")
          [[ -z "$DATADOG_API_KEY" ]]     && MISSING+=("PRODUCTION_DATADOG_API_KEY")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: The following required secrets are not set in the 'production' environment:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All required secrets are present."
          echo "Deploy reason: ${{ github.event.inputs.reason }}"

      # Role ARN is a resource identifier, not a credential — hardcoded is safe.
      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985057277127:role/payments-api-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── SAM Build ────────────────────────────────────────────────────────────
      - name: SAM Build
        working-directory: api
        run: sam build --template infra/lambda.yaml

      # ── DynamoDB Tables ──────────────────────────────────────────────────────
      # Deployed as a separate stack so tables survive Lambda stack re-deploys.
      - name: Deploy DynamoDB tables
        run: |
          aws cloudformation deploy \
            --region "${{ env.AWS_REGION }}" \
            --template-file api/infra/dynamodb.yaml \
            --stack-name "${{ env.DYNAMO_STACK }}" \
            --parameter-overrides EnvironmentName=${{ env.ENVIRONMENT }} \
            --no-fail-on-empty-changeset \
            --tags \
              Environment=${{ env.ENVIRONMENT }} \
              Project=payments-api \
              ManagedBy=github-actions \
              DeployedBy=github-actions \
              GitSha=${{ github.sha }} \
              GitBranch=${{ github.ref_name }}

      # ── Lambda Application ───────────────────────────────────────────────────
      # All parameters passed explicitly (SAM CLI --parameter-overrides replaces,
      # not merges with, samconfig.toml parameter_overrides).
      # Secrets are injected at deploy time and never stored in samconfig.toml.
      - name: Deploy Lambda application
        working-directory: api
        env:
          PRODUCTION_ASAAS_TOKEN: ${{ secrets.PRODUCTION_ASAAS_TOKEN }}
          PRODUCTION_ASAAS_WEBHOOK_TOKEN: ${{ secrets.PRODUCTION_ASAAS_WEBHOOK_TOKEN }}
          PRODUCTION_ADMIN_SECRET: ${{ secrets.PRODUCTION_ADMIN_SECRET }}
          PRODUCTION_DATADOG_API_KEY: ${{ secrets.PRODUCTION_DATADOG_API_KEY }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${{ env.LAMBDA_STACK }}" \
            --region "${{ env.AWS_REGION }}" \
            --resolve-s3 \
            --s3-prefix payments-api/production \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags \
              "Environment=${{ env.ENVIRONMENT }}" \
              "Project=payments-api" \
              "ManagedBy=sam" \
              "DeployedBy=github-actions" \
              "GitSha=${{ github.sha }}" \
              "GitBranch=${{ github.ref_name }}" \
            --parameter-overrides \
              EnvironmentName=production \
              AsaasMock=false \
              AsaasUrl=https://api.asaas.com \
              EnabledPaymentProviders=ASAAS \
              DefaultPaymentProvider=ASAAS \
              WebhookProcessingMode=async \
              DatadogEnabled=true \
              DatadogSite=datadoghq.com \
              DatadogExtensionLayerArn=arn:aws:lambda:us-east-1:464622532012:layer:Datadog-Extension:97 \
              DatadogVersion=5.111.0 \
              AsaasToken="$PRODUCTION_ASAAS_TOKEN" \
              AsaasWebhookToken="$PRODUCTION_ASAAS_WEBHOOK_TOKEN" \
              AdminSecret="$PRODUCTION_ADMIN_SECRET" \
              DatadogApiKey="$PRODUCTION_DATADOG_API_KEY"

      # ── Retrieve deployed API URL ────────────────────────────────────────────
      - name: Get API URL
        id: get-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --region "${{ env.AWS_REGION }}" \
            --stack-name "${{ env.LAMBDA_STACK }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiFunctionUrl'].OutputValue" \
            --output text)
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed to: ${API_URL}"

      - name: Deployment summary
        run: |
          {
            echo "### Production Deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **API URL** | ${{ steps.get-url.outputs.api_url }} |"
            echo "| **Webhook** | \`${{ steps.get-url.outputs.api_url }}webhook/payments\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **DynamoDB stack** | \`${{ env.DYNAMO_STACK }}\` |"
            echo "| **Lambda stack** | \`${{ env.LAMBDA_STACK }}\` |"
            echo "| **Deployed at** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| **Reason** | ${{ github.event.inputs.reason }} |"
            echo ""
            echo "#### Configuration deployed"
            echo "\`\`\`"
            echo "AsaasUrl          = https://api.asaas.com  (LIVE API)"
            echo "AsaasMock         = false"
            echo "WebhookProcessing = async"
            echo "DatadogEnabled    = true"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Smoke Test ───────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test — Live Production Endpoint
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985057277127:role/payments-api-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve API URL
        id: resolve-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --region "${{ env.AWS_REGION }}" \
            --stack-name "${{ env.LAMBDA_STACK }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiFunctionUrl'].OutputValue" \
            --output text)
          API_URL="${API_URL%/}"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "Testing: ${API_URL}"

      - name: Smoke — API is reachable (auth guard returns 401)
        run: |
          API_URL="${{ steps.resolve-url.outputs.api_url }}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${API_URL}/invoices" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 15)

          if [[ "$STATUS" != "401" ]]; then
            echo "FAIL: Expected 401, got ${STATUS}"
            exit 1
          fi
          echo "PASS: Auth guard active — POST /invoices returned 401."

      - name: Smoke — DELETE /invoices/:id without token returns 401
        run: |
          API_URL="${{ steps.resolve-url.outputs.api_url }}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE "${API_URL}/invoices/test-id" \
            --max-time 15)

          if [[ "$STATUS" != "401" ]]; then
            echo "FAIL: Expected 401, got ${STATUS}"
            exit 1
          fi
          echo "PASS: Auth guard active — DELETE /invoices/:id returned 401."

      - name: Smoke summary
        if: always()
        run: |
          {
            echo "### Smoke Test Results"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| API reachable | ✅ |"
            echo "| Auth guard active (POST /invoices → 401) | ✅ |"
            echo "| Auth guard active (DELETE /invoices/:id → 401) | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
