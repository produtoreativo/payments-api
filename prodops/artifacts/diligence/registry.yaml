# ProdOps Diligence Entity Registry
# =================================
# Este arquivo é um ÍNDICE — não uma fonte narrativa.
# O arquivo individual de cada entidade prevalece sobre qualquer resumo aqui.
# Este arquivo DEVE poder ser reconstruído a partir dos arquivos de entidade.
#
# Atualizar sempre que uma entidade for criada ou modificada (na mesma mudança).
# Validar contra os arquivos em cada Scan da Diligence Async.
#
# → Modelo canônico: prodops/framework/journeys/diligence/model/
# → Instâncias: prodops/artifacts/diligence/
# → Instrução de uso: prodops/artifacts/diligence/README.md

version: 1
schema_version: "1.0"
last_updated: "2026-07-24"
last_updated_by: "cmilfont"
last_reconcile: "2026-07-24"

# Sequências para geração de IDs (atualizar ao criar nova entidade)
# Procedimento:
#   1. Ler este arquivo
#   2. Verificar last_sequence para o tipo + ano corrente
#   3. Verificar arquivos no diretório correspondente para confirmar
#   4. Usar last_sequence + 1 como próximo ID
#   5. Criar o arquivo
#   6. Atualizar last_sequence aqui (na mesma mudança)
sequences:
  FND:
    year: 2026
    last_sequence: 0
  EVD:
    year: 2026
    last_sequence: 3
  RMD:
    year: 2026
    last_sequence: 0
  WVR:
    year: 2026
    last_sequence: 0

# Índice de entidades
# ===================
# Formato:
#
#   <ID>:
#     type: Finding | Evidence | Remediation | Waiver
#     path: <path relativo a prodops/artifacts/diligence/>
#     status: <estado atual da entidade>
#     severity: <severidade — apenas para Findings>  # omitir para outros tipos
#     related:
#       evidence: []        # IDs de Evidence (para Findings)
#       remediations: []    # IDs de Remediation (para Findings)
#       waivers: []         # IDs de Waiver (para Findings)
#       findings: []        # IDs de Finding (para Evidence, Remediation, Waiver)
#
# Notas:
#   - Usar IDs completos: FND-2026-0001, EVD-2026-0001, etc.
#   - status deve refletir o estado atual do arquivo de entidade
#   - related deve ser bidirecional: se Finding referencia Evidence, a Evidence referencia o Finding
#   - path é relativo a prodops/artifacts/diligence/ (ex: findings/FND-2026-0001.md)
entities:
  EVD-2026-0001:
    type: Evidence
    path: evidence/EVD-2026-0001.md
    status: Collected
    related:
      findings: []
      # Inspection snapshot — no finding generated by this Evidence

  EVD-2026-0002:
    type: Evidence
    path: evidence/EVD-2026-0002.md
    status: Collected
    related:
      findings: []
      # Post-Reconcile snapshot — no finding generated by this Evidence

  EVD-2026-0003:
