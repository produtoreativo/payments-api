schema_version: 1
catalog_version: "1.0.0"
last_updated: "2026-07-24"
description: >
  Catálogo canônico de Checks da Jornada de Diligence.
  Este catálogo é declarativo — descreve regras, não implementações.
  Checks não executam Checks. Checks não criam Findings diretamente.
  → Modelo canônico: prodops/framework/journeys/diligence/model/check.md
  → Instâncias: prodops/artifacts/diligence/
  → Templates: prodops/templates/diligence/

defaults:
  finding_template: prodops/templates/diligence/finding.md
  findings_dir: prodops/artifacts/diligence/findings/
  evidence_template: prodops/templates/diligence/evidence.md
  evidence_dir: prodops/artifacts/diligence/evidence/
  registry: prodops/artifacts/diligence/registry.yaml
  deduplication_key:
    - check_id
    - primary_subject
    - condition
    - scope

checks:
  - id: DIL-CON-001
    version: 1
    status: Active
    name: "Normative Vocabulary Consistency"
    description: >
      Verifica que documentos normativos utilizam os termos canônicos definidos
      no glossário e na ontologia do framework. Exemplos de termos incorretos que
      devem ser detectados: "Business Signal Issue" como tipo de Issue canônica,
      "Workspace Reconciliation" referenciado como Cycle (é uma Capability),
      "Product Intent Backlog" (não é um backlog canônico), títulos de Work Item
      no formato "[Operation] — [Type] [ID]: desc" (não é o padrão canônico).
      Esta regra NÃO se aplica a trilhas históricas nem a conteúdo explicitamente
      rotulado como legado — histórico preserva o vocabulário do momento original.
    primary_dimension: Conceptual
    secondary_dimensions: []
    category: Documentation
    type: Conformance
    scope:
      - Normative document
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Normative document change
    source_of_truth:
      - prodops/framework/glossary.md
      - prodops/framework/ontology.md
      - prodops/framework/knowledge-vs-execution.md
    expected_condition: >
      Todos os termos presentes no documento normativo avaliado pertencem ao
      vocabulário canônico do framework conforme definido no glossário e na
      ontologia. Nenhuma denominação obsoleta, alternativa não aprovada ou
      classificação incorreta de entidade é usada como instrução atual.
    failure_condition: >
      O documento normativo contém termo não canônico, denominação obsoleta ou
      classificação incorreta de entidade (ex: Workspace Reconciliation tratada
      como Cycle em vez de Capability; "Business Signal Issue" como tipo de Issue
      canônica; título de Work Item no formato legado).
    warning_condition: ""
    not_applicable_condition: >
      O documento avaliado é uma trilha histórica (trail), registro de sessão
      histórico, ou foi explicitamente rotulado como conteúdo legado. Vocabulário
      histórico em trilhas não é inconsistência — preserva o estado original.
    indeterminate_condition: >
      O termo encontrado não está nem no glossário canônico nem na lista de
      termos proibidos — requer revisão humana para classificar.
    error_condition: >
      O documento não pôde ser lido ou o glossário/ontologia de referência não
      está acessível no momento da avaliação.
    severity_default: Medium
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: false
    human_review_required: true
    evidence_required:
      - Path do documento e seção onde o termo foi encontrado
      - Termo observado (exato, com contexto de 1-2 frases)
      - Termo canônico esperado conforme source_of_truth
    subject_type:
      - Document
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Atualizar o documento substituindo o termo não canônico pelo termo correto
      conforme glossário e ontologia. Se o conteúdo é histórico, adicionar nota
      de contexto sem alterar o registro original.
    escalation_targets:
      - Framework Owner
    notes: ""

  - id: DIL-CON-002
    version: 1
    status: Active
    name: "Ontological Classification Consistency"
    description: >
      Verifica que os conceitos do framework — Journey, Cycle, Phase, Capability
      e Skill — são classificados corretamente conforme a ontologia canônica em
      contextos normativos. Exemplo crítico: workspace-reconciliation é uma
      Capability invocada pelos ciclos, não um terceiro Cycle independente.
      Atribuir a classificação errada a esses conceitos cria ambiguidade sobre
      o modelo de execução da Diligence. Não se aplica a trilhas históricas.
    primary_dimension: Conceptual
    secondary_dimensions: []
    category: Documentation
    type: Consistency
    scope:
      - Normative document
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Normative document change
    source_of_truth:
      - prodops/framework/ontology.md
    expected_condition: >
      Todos os conceitos do framework (Journey, Cycle, Phase, Capability, Skill)
      são referenciados com a classificação correta em documentos normativos.
      Workspace Reconciliation aparece exclusivamente como Capability, nunca
      como Cycle.
    failure_condition: >
      Um conceito do framework é classificado de forma inconsistente com a
      ontologia canônica (ex: Workspace Reconciliation referenciada como Cycle;
      Phase referenciada como Cycle; Skill referenciada como Journey).
    warning_condition: ""
    not_applicable_condition: >
      O documento avaliado é uma trilha histórica ou conteúdo explicitamente
      rotulado como legado.
    indeterminate_condition: >
      O conceito encontrado não está coberto pela ontologia atual — requer
      decisão do Framework Owner sobre classificação.
    error_condition: >
      A ontologia de referência não está acessível no momento da avaliação.
    severity_default: High
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: false
    human_review_required: true
    evidence_required:
      - Path do documento e seção com a classificação incorreta
      - "Classificação encontrada (ex: \"Cycle\")"
      - "Classificação canônica esperada (ex: \"Capability\") conforme ontologia.md"
    subject_type:
      - Document
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Atualizar o documento com a classificação canônica correta. Documentar
      a mudança no trail do artefato se relevante para contexto histórico.
    escalation_targets:
      - Framework Owner
    notes: ""

  - id: DIL-STR-001
    version: 1
    status: Active
    name: "Entity File in Canonical Path"
    description: >
      Verifica que arquivos de entidade da Diligence (Finding, Evidence,
      Remediation, Waiver) existem no diretório canônico declarado no manifest
      e que o nome do arquivo é exatamente igual ao ID declarado no front matter.
      Um arquivo FND-2026-0001.md deve residir em
      prodops/artifacts/diligence/findings/ e seu front matter deve declarar
      id: FND-2026-0001. Divergência nesta regra quebra rastreabilidade por ID.
      waiver_allowed é false porque usar path incorreto é violação estrutural que
      torna o ID não-rastreável por qualquer mecanismo automatizável.
    primary_dimension: Structural
    secondary_dimensions: []
    category: Governance
    type: Presence
    scope:
      - Finding file
      - Evidence file
      - Remediation file
      - Waiver file
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Entity file creation
    source_of_truth:
      - prodops/artifacts/diligence/README.md
      - prodops/exec/manifest.yaml
    expected_condition: >
      Todos os arquivos de entidade da Diligence residem no diretório canônico
      para seu tipo (findings/, evidence/, remediations/, waivers/) e o nome
      do arquivo coincide exatamente com o ID declarado no front matter.
    failure_condition: >
      Um arquivo de entidade está em diretório incorreto (ex: Finding em
      evidence/) ou o nome do arquivo difere do ID no front matter (ex: arquivo
      chamado FND-2026-X.md mas front matter declara id: FND-2026-0001).
    warning_condition: ""
    not_applicable_condition: >
      Nenhuma entidade da Diligence existe ainda no produto — diretórios vazios
      não geram Finding.
    indeterminate_condition: >
      O arquivo não possui front matter legível ou o campo id está ausente.
    error_condition: >
      Os diretórios canônicos não existem no repositório ou o manifest não
      está acessível.
    severity_default: High
    blocking: true
    blocking_scope:
      - Registry Update
    waiver_allowed: false
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Path atual do arquivo de entidade
      - Nome do arquivo (filename)
      - Valor do campo id no front matter do arquivo
      - Path canônico esperado conforme manifest.yaml
    subject_type:
      - Document
      - Finding
      - Evidence
      - Remediation
      - Waiver
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Mover o arquivo para o diretório canônico correto e/ou renomear o arquivo
      para coincidir com o ID no front matter. Atualizar registry.yaml na mesma
      operação. Nunca alterar o ID da entidade — apenas a localização do arquivo.
    escalation_targets:
      - Framework Owner
    notes: >
      waiver_allowed: false porque usar path incorreto torna o ID não-rastreável.
      Nenhuma justificativa de negócio pode compensar a quebra de rastreabilidade
      estrutural de entidades da Diligence.

  - id: DIL-STR-002
    version: 1
    status: Active
    name: "Registry Consistent with Entity Files"
    description: >
      Verifica a consistência bidirecional entre registry.yaml e os arquivos de
      entidade: toda entidade no registry deve ter arquivo correspondente, e todo
      arquivo de entidade deve ter entrada no registry. Quando há divergência,
      o arquivo de entidade sempre prevalece — o registry é reconstruível a partir
      dos arquivos. Drift entre registry e arquivos é Finding estrutural a ser
      reparado pelo próximo ciclo Repair.
    primary_dimension: Structural
    secondary_dimensions: []
    category: Governance
    type: Consistency
    scope:
      - Registry file
      - Entity files
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Registry update
    source_of_truth:
      - prodops/artifacts/diligence/README.md
    expected_condition: >
      O registry.yaml contém exatamente as mesmas entidades que os arquivos
      presentes nos diretórios findings/, evidence/, remediations/ e waivers/.
      Nenhuma entrada orphã no registry; nenhum arquivo sem entrada no registry.
    failure_condition: >
      Existe entrada no registry sem arquivo correspondente no diretório, ou
      existe arquivo de entidade sem entrada no registry. Qualquer divergência
      entre o conjunto de IDs no registry e o conjunto de nomes de arquivo é
      uma inconsistência estrutural.
    warning_condition: ""
    not_applicable_condition: >
      Nenhuma entidade existe ainda — registry vazio e diretórios vazios são
      estado consistente.
    indeterminate_condition: >
      O registry.yaml não pôde ser lido ou está malformado.
    error_condition: >
      O registry.yaml não existe ou os diretórios de entidades não existem.
    severity_default: Medium
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Lista de IDs no registry.yaml
      - Lista de nomes de arquivo nos diretórios de entidade
      - Diff entre as duas listas (entradas em apenas um dos lados)
    subject_type:
      - Document
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Reconstruir registry.yaml a partir dos arquivos de entidade (o arquivo
      sempre prevalece). Se há entrada no registry sem arquivo, remover a entrada.
      Se há arquivo sem entrada, adicionar a entrada ao registry.
    escalation_targets:
      - Framework Owner
    notes: ""

  - id: DIL-STR-003
    version: 1
    status: Active
    name: "Entity ID Uniqueness"
    description: >
      Verifica que nenhum ID de entidade da Diligence aparece mais de uma vez
      no conjunto de arquivos e registry. Colisão de ID é a falha estrutural
      mais grave do sistema — torna impossível referenciar inequivocamente uma
      entidade. waiver_allowed: false porque ID duplicado destrói rastreabilidade
      de forma irreversível enquanto a colisão existir — não há modo seguro de
      conviver com IDs duplicados.
    primary_dimension: Structural
    secondary_dimensions: []
    category: Governance
    type: Presence
    scope:
      - All entity files
      - Registry file
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Entity file creation
    source_of_truth:
      - prodops/artifacts/diligence/README.md
    expected_condition: >
      Cada ID de entidade (FND-YYYY-NNNN, EVD-YYYY-NNNN, RMD-YYYY-NNNN,
      WVR-YYYY-NNNN) aparece no máximo uma vez no conjunto total de arquivos
      e no registry. Não existe colisão entre entidades do mesmo tipo nem
      entre tipos diferentes.
    failure_condition: >
      O mesmo ID aparece em dois ou mais arquivos, ou aparece mais de uma vez
      no registry. Qualquer colisão de ID, independente do tipo de entidade.
    warning_condition: ""
    not_applicable_condition: >
      Nenhuma entidade existe ainda — estado vazio não tem risco de colisão.
    indeterminate_condition: >
      Um arquivo não pôde ser lido ou o ID não está legível no front matter.
    error_condition: >
      Os diretórios ou o registry não puderam ser lidos.
    severity_default: Critical
    blocking: true
    blocking_scope:
      - Registry Update
    waiver_allowed: false
    auto_finding: true
    human_review_required: true
    evidence_required:
      - Lista completa de IDs encontrados no registry
      - Lista completa de IDs encontrados nos arquivos de entidade
      - Resultado da detecção de colisão (IDs duplicados identificados)
    subject_type:
      - Document
      - Finding
      - Evidence
      - Remediation
      - Waiver
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Para resolver colisão: identificar qual dos arquivos com ID duplicado é
      o original (verificar git log, datas de criação, contexto). O duplicado
      deve receber novo ID gerado corretamente pelo protocolo de sequência.
      Nunca excluir um dos arquivos sem preservar seu conteúdo. Atualizar todas
      as referências ao ID duplicado após a resolução.
    escalation_targets:
      - Framework Owner
    notes: >
      waiver_allowed: false. ID duplicado torna rastreabilidade estruturalmente
      impossível. Não há modo seguro de operar com IDs duplicados ativos.

  - id: DIL-TRC-001
    version: 1
    status: Active
    name: "Active Work Item Has Valid Artifact Reference"
    description: >
      Verifica que um Work Item representando uma operação ativa tem pelo menos
      uma referência canônica válida a um artefato do Knowledge Space (campos
      artifact_type e artifact_id preenchidos com valores canônicos). Esta regra
      se aplica APENAS quando a operação registrada no Work Item requer
      rastreabilidade por política — operações de Diligence que endereçam Findings
      podem referenciar o Finding em vez de um OBC. Não se aplica quando o Work
      Item já está fechado.
    primary_dimension: Traceability
    secondary_dimensions:
      - Operational
    category: Work Item
    type: Traceability
    scope:
      - Active Work Item
    execution_modes:
      - Sync
      - Async
    cycles:
      - diligence-sync
      - diligence-async
    phases:
      - Attach
      - Scan
    capabilities:
      - Divergence Detection
      - Readiness Verification
    triggers:
      - Work Item creation
      - Scheduled scan
      - Promote gate
    source_of_truth:
      - prodops/framework/execution-mapping/work-item-schema.md
      - prodops/framework/knowledge-vs-execution.md
    expected_condition: >
      O Work Item ativo possui campos artifact_type e artifact_id preenchidos
      com valores canônicos que identificam inequivocamente o artefato afetado.
      O artefato referenciado existe no Knowledge Space.
    failure_condition: >
      O Work Item está em estado ativo (Open, In Progress, Blocked, In Review)
      e não possui artifact_type ou artifact_id preenchidos com valores válidos,
      ou os valores não referenciam artefato existente.
    warning_condition: ""
    not_applicable_condition: >
      O Work Item está fechado (Done, Cancelled) ou a operação não requer
      rastreabilidade por política (ex: Work Item puramente administrativo
      não governado pelo ProdOps). Também não se aplica quando o item não
      é governado pelo ProdOps.
    indeterminate_condition: >
      Os campos existem mas os valores não pertencem aos enums canônicos —
      requer análise humana para determinar se é divergência ou tipo não
      catalogado ainda.
    error_condition: >
      A API do GitHub não pôde ser consultada ou o Work Item não pôde ser
      acessado.
    severity_default: High
    blocking: true
    blocking_scope:
      - Promote
      - Close
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - URL do Work Item
      - Valor observado do campo artifact_id (ou sua ausência)
      - Resultado da resolução do artifact_id (artefato existe/não existe)
    subject_type:
      - Work Item
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Preencher os campos artifact_type e artifact_id no Work Item com os valores
      canônicos correspondentes ao artefato que a operação afeta. Consultar
      prodops/framework/execution-mapping/work-item-schema.md para enums válidos.
    escalation_targets:
      - Framework Owner
      - Artifact Owner
    notes: ""

  - id: DIL-TRC-002
    version: 1
    status: Active
    name: "Artifact Reference Resolves to Existing Artifact"
    description: >
      Verifica que uma referência de artefato (artifact_id ou path) presente em
      um Work Item ou Finding resolve para um artefato real e existente no
      repositório. Referências quebradas (artifact_id apontando para arquivo
      inexistente) rompem a cadeia de rastreabilidade e tornam o Work Item ou
      Finding irresolvível. Não se aplica quando o Work Item está fechado ou
      o artefato foi explicitamente arquivado.
    primary_dimension: Traceability
    secondary_dimensions: []
    category: Artifact
    type: Validity
    scope:
      - Work Item artifact reference
      - Finding artifact reference
    execution_modes:
      - Sync
      - Async
    cycles:
      - diligence-sync
      - diligence-async
    phases:
      - Attach
      - Scan
      - Promote
    capabilities:
      - Divergence Detection
      - Readiness Verification
    triggers:
      - Work Item creation or update
      - Scheduled scan
      - Promote gate
    source_of_truth:
      - prodops/framework/knowledge-vs-execution.md
    expected_condition: >
      O artifact_id ou path referenciado em um Work Item ou Finding corresponde
      a um arquivo existente no repositório no path canônico esperado para o
      artifact_type declarado.
    failure_condition: >
      O artifact_id ou path de artefato referenciado não corresponde a nenhum
      arquivo existente no repositório. A referência é quebrada.
    warning_condition: ""
    not_applicable_condition: >
      O Work Item está fechado (Done, Cancelled) ou o artefato foi
      explicitamente movido para archive com registro formal de arquivamento.
    indeterminate_condition: >
      O artifact_type não pertence a nenhum enum canônico — path esperado
      não pode ser determinado sem revisão humana.
    error_condition: >
      O repositório não pôde ser acessado para verificação de existência do
      arquivo.
    severity_default: High
    blocking: true
    blocking_scope:
      - Promote
      - Repair
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Valor do artifact_id referenciado
      - Path esperado do artefato no repositório
      - Resultado da verificação de existência do arquivo (exists: true/false)
    subject_type:
      - Work Item
      - Finding
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Verificar se o artefato foi renomeado, movido ou ainda não foi criado.
      Se renomeado/movido: atualizar a referência no Work Item ou Finding.
      Se não criado: criar o artefato ou remover a referência prematura.
    escalation_targets:
      - Artifact Owner
      - Framework Owner
    notes: ""

  - id: DIL-TRC-003
    version: 1
    status: Active
    name: "Finding References Valid Check"
    description: >
      Verifica que o check_id declarado no front matter de um Finding referencia
      um Check existente no catalog.yaml, e que a versão do Check usada está
      registrada no Finding. Esta rastreabilidade garante que Findings podem ser
      reavaliados quando a regra do Check muda. Não se aplica quando o Finding
      foi criado manualmente por processo humano sem automação de Check
      (auto_finding: false no Check correspondente, ou campo check_id ausente
      por design).
    primary_dimension: Traceability
    secondary_dimensions: []
    category: Evidence
    type: Validity
    scope:
      - Finding file
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Finding creation
    source_of_truth:
      - prodops/framework/journeys/diligence/checks/catalog.yaml
    expected_condition: >
      O campo check_id no front matter do Finding referencia um ID existente em
      catalog.yaml e o campo check_version está preenchido com a versão do Check
      usada no momento da criação do Finding.
    failure_condition: >
      O check_id no Finding não existe no catalog.yaml (ID inválido ou Check
      removido), ou check_version está ausente quando check_id está presente.
    warning_condition: ""
    not_applicable_condition: >
      O Finding não possui campo check_id — foi criado por processo manual
      sem automação de Check. Isso é legítimo quando o Check é do tipo
      human_review_required: true com auto_finding: false.
    indeterminate_condition: >
      O catalog.yaml não está acessível para verificação do ID.
    error_condition: >
      O catalog.yaml não pôde ser lido ou está malformado.
    severity_default: Medium
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Valor do campo check_id no front matter do Finding
      - Resultado da busca do check_id no catalog.yaml (encontrado/não encontrado)
    subject_type:
      - Finding
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Se o Check foi removido do catálogo: atualizar o Finding para refletir
      o status Invalid Rule. Se o Check foi renumerado: atualizar o check_id
      para o ID correto. Se check_version está ausente: consultar o histórico
      do catalog.yaml para determinar a versão vigente na data de criação.
    escalation_targets:
      - Framework Owner
    notes: ""

  - id: DIL-TRC-004
    version: 1
    status: Active
    name: "Remediation References Existing Finding"
    description: >
      Verifica que todos os finding_ids declarados em um arquivo de Remediation
      resolvem para arquivos de Finding reais existentes em
      prodops/artifacts/diligence/findings/. Uma Remediation sem Finding válido
      é uma referência dangling — não tem critério de conclusão verificável.
      waiver_allowed: false porque Remediation sem Finding válido não tem
      fundamento — sem Finding existente, não há critério de verificação possível.
    primary_dimension: Traceability
    secondary_dimensions: []
    category: Governance
    type: Validity
    scope:
      - Remediation file
    execution_modes:
      - Async
      - Manual
    cycles:
