  - id: DIL-OPS-001
    version: 1
    status: Active
    name: "Business Signal Without Active Operation Does Not Require Work Item"
    description: >
      Este Check PROVA o modelo N:M correto. Quando um Business Signal existe
      mas não tem operação ativa em andamento, a ausência de Work Item é o
      estado CORRETO — não é uma divergência. O resultado deste Check DEVE ser
      Pass ou Not Applicable, NUNCA Fail. Se um avaliador tenta classificar a
      ausência de Work Item para Signal passivo como Fail, essa classificação é
      ela própria uma violação do modelo canônico knowledge-vs-execution.md.
      Este Check pode ser executado para confirmar explicitamente que o estado
      está correto (resultado Pass) e registrar o estado avaliado no trail.
    primary_dimension: Operational
    secondary_dimensions: []
    category: Work Item
    type: Absence
    scope:
      - Business Signal
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
    source_of_truth:
      - prodops/framework/knowledge-vs-execution.md
    expected_condition: >
      Business Signal existe na tracking list sem marcação de operação ativa →
      ausência de Work Item é o estado correto. Resultado: Pass.
    failure_condition: >
      ESTE CHECK NÃO PODE RETORNAR FAIL para Signal passivo. Se o avaliador
      tenta registrar Fail pela ausência de Work Item para Signal sem operação
      ativa, isso constitui violação do modelo N:M canônico — o próprio ato
      de tentar falhar este check para Signal passivo é a divergência a reportar.
    warning_condition: ""
    not_applicable_condition: >
      O Business Signal não existe na tracking list canônica ou não é rastreado
      pelo ProdOps (Signal de sistema externo não governado).
    indeterminate_condition: >
      Não é possível determinar se o Signal tem operação ativa (tracking list
      inacessível ou marcação ambígua).
    error_condition: >
      A tracking list não pôde ser lida.
    severity_default: Info
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: false
    human_review_required: false
    evidence_required:
      - ID do Business Signal na tracking list
      - Ausência de marcação de operação ativa (confirmação explícita)
      - Ausência de Work Item referenciando o Signal (confirmada como estado correto)
    subject_type:
      - Document
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Nenhuma remediation necessária — ausência de Work Item para Signal passivo
      é o estado correto. Registrar no trail que o estado foi avaliado e está
      conforme o modelo N:M.
    escalation_targets:
      - Framework Owner
    notes: >
      Este Check documenta o estado correto, não uma divergência. Resultado
      esperado sempre Pass ou Not Applicable. Nunca Fail para Signal passivo.

  - id: DIL-OPS-002
    version: 1
    status: Active
    name: "Active Operation Without Traceable Work Item"
    description: >
      Quando uma operação sobre um artefato é explicitamente marcada como ativa
      (marcação na tracking list, em andamento, referenciada em decisão de
      Assessment ou de qualquer jornada competente), e não existe Work Item
      correspondente e rastreável, esta é uma divergência operacional. Diferente
      do DIL-OPS-001 que confirma o estado correto de Signal passivo, este Check
      detecta a situação em que há operação ativa SEM rastreamento.
    primary_dimension: Operational
    secondary_dimensions:
      - Traceability
    category: Work Item
    type: Presence
    scope:
      - Active operation record
    execution_modes:
      - Async
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
    source_of_truth:
      - prodops/framework/knowledge-vs-execution.md
      - prodops/framework/execution-mapping/work-item-schema.md
    expected_condition: >
      Toda operação explicitamente marcada como ativa sobre um artefato possui
      pelo menos um Work Item rastreável com os campos canônicos preenchidos
      (artifact_type, artifact_id, operation, journey).
    failure_condition: >
      Uma operação está marcada como ativa na tracking list, em uma decisão de
      jornada, ou em outro registro canônico, mas não existe Work Item com
      referência ao artefato e à operação correspondente.
    warning_condition: ""
    not_applicable_condition: >
      A operação é passiva/informacional (sem marcação de ativa), não há
      operação registrada como ativa, ou o item é intencionalmente não
      rastreado por política explícita documentada.
    indeterminate_condition: >
      A marcação de operação ativa é ambígua — requer revisão humana para
      determinar se a operação está de fato ativa.
    error_condition: >
      A tracking list ou o sistema de Work Items não pôde ser consultado.
    severity_default: Medium
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Entrada na tracking list com marcação de operação ativa
      - Resultado da busca de Work Item referenciando o artefato e operação (ausência confirmada)
    subject_type:
      - Document
      - Work Item
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Criar Work Item com os campos canônicos preenchidos referenciando o artefato
      e a operação ativa. Consultar prodops/framework/execution-mapping/
      work-item-schema.md para campos obrigatórios e enums válidos.
    escalation_targets:
      - Framework Owner
      - Artifact Owner
    notes: ""

  - id: DIL-OPS-003
    version: 1
    status: Active
    name: "Work Item Closure Does Not Close Finding"
    description: >
      Verifica que quando um Work Item referenciado por um Finding é fechado,
      o Finding NÃO é automaticamente transitado para Verified ou Closed sem
      verificação independente. Fechar um Issue no GitHub não resolve a condição
      que gerou o Finding — apenas indica que a operação associada ao Work Item
      terminou. O Finding deve ser verificado independentemente. Este é um
      meta-check de conformidade de processo, executado durante as fases Repair
      ou Close.
    primary_dimension: Operational
    secondary_dimensions: []
    category: Governance
    type: Consistency
    scope:
      - Finding file
      - Work Item
    execution_modes:
      - Sync
      - Async
    cycles:
      - diligence-sync
      - diligence-async
    phases:
      - Close
      - Repair
    capabilities:
      - Divergence Detection
    triggers:
      - Work Item closure
      - Scheduled scan
    source_of_truth:
      - prodops/framework/journeys/diligence/model/finding.md
      - prodops/artifacts/diligence/README.md
    expected_condition: >
      Findings em estado Resolved, Verified ou Closed possuem Evidence de
      verificação independente (verified_at preenchido com timestamp de
      verificação) e Evidence de verificação registrada — não apenas o fechamento
      do Work Item associado.
    failure_condition: >
      Um Finding transitou para Verified ou Closed sem campo verified_at
      preenchido, sem Evidence de verificação independente, ou a única
      justificativa para a transição é o fechamento de Work Item associado.
    warning_condition: ""
    not_applicable_condition: >
      Nenhum Finding está associado ao Work Item fechado, ou o Finding foi
      verificado independentemente antes do fechamento do Work Item.
    indeterminate_condition: >
      O Finding possui verified_at mas não há Evidence de verificação referenciada
      — requer revisão humana para determinar se a verificação foi executada.
    error_condition: >
      O arquivo do Finding não pôde ser lido.
    severity_default: High
    blocking: true
    blocking_scope:
      - Close
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Status atual do Finding
      - Status do Work Item associado
      - Campo verified_at do Finding (presente/ausente)
      - Evidence IDs de verificação referenciados no Finding (presentes/ausentes)
    subject_type:
      - Finding
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Executar verificação independente da condição descrita no Finding.
      Coletar Evidence de que a condição foi de fato resolvida. Preencher
      verified_at e referenciar a Evidence de verificação antes de transicionar
      o Finding para Verified ou Closed.
    escalation_targets:
      - Framework Owner
      - Diligence Owner
    notes: ""

  - id: DIL-OPS-004
    version: 1
    status: Active
    name: "Remediation Implemented Requires Independent Verification"
    description: >
      Verifica que uma Remediation com status Implemented tem Evidence de
      verificação independente coletada e um Check re-executado registrado antes
      do Finding transicionar para Verified. Implemented ≠ Verified é um
      princípio canônico: a implementação da correção não confirma que a
      condição foi eliminada. waiver_allowed: false porque dispensar a
      verificação independente elimina a integridade do ciclo de auditoria —
      não há justificativa de negócio que compense a ausência de verificação.
    primary_dimension: Operational
    secondary_dimensions: []
    category: Evidence
    type: Outcome
    scope:
      - Remediation file
      - Finding file
    execution_modes:
      - Sync
      - Async
    cycles:
      - diligence-sync
      - diligence-async
    phases:
      - Close
      - Repair
    capabilities:
      - Divergence Detection
    triggers:
      - Remediation status change to Implemented
      - Finding status change to Resolved
    source_of_truth:
      - prodops/framework/journeys/diligence/model/remediation.md
      - prodops/artifacts/diligence/README.md
    expected_condition: >
      Toda Remediation com status Implemented possui: (1) verificação independente
      por pessoa ou agente diferente de quem implementou, (2) Evidence de
      verificação coletada após a implementação (EVD-YYYY-NNNN), (3) o Finding
      associado foi reavaliado com re-execução do Check original ou equivalente.
    failure_condition: >
      A Remediation tem status Implemented mas o Finding associado transitou
      para Verified sem Evidence de verificação independente, sem re-execução
      do Check, ou a verificação foi feita pela mesma entidade que executou
      a Remediation.
    warning_condition: ""
    not_applicable_condition: >
      A Remediation ainda não atingiu o status Implemented ou o Finding associado
      ainda está em estado anterior a Resolved.
    indeterminate_condition: >
      Evidence de verificação existe mas não é possível confirmar independência
      do verificador.
    error_condition: >
      Os arquivos de Remediation ou Finding não puderam ser lidos.
    severity_default: High
    blocking: true
    blocking_scope:
      - Close
    waiver_allowed: false
    auto_finding: true
    human_review_required: true
    evidence_required:
      - Status da Remediation
      - Campo verification_check_id (se preenchido)
      - Lista de Evidence IDs coletados após implementação
      - Campo verified_at do Finding associado
    subject_type:
      - Remediation
      - Finding
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Designar verificador independente (diferente de quem implementou).
      Re-executar o Check original ou equivalente. Coletar Evidence do resultado
      da re-execução. Atualizar o Finding apenas após confirmação de que a
      condição foi eliminada.
    escalation_targets:
      - Framework Owner
      - Diligence Owner
    notes: >
      waiver_allowed: false. Dispensar verificação independente destrói a
      integridade do ciclo de auditoria da Diligence.

  - id: DIL-OPS-005
    version: 1
    status: Active
    name: "Active Waiver Has Required Fields"
    description: >
      Verifica que todo Waiver com status Active possui todos os campos
      obrigatórios preenchidos: approved_by, approved_at, expires_at, scope,
      reason, risk_accepted e evidence (pelo menos um EVD-YYYY-NNNN).
      Um Waiver ativo com campos obrigatórios ausentes é inválido por definição
      do schema canônico. waiver_allowed: false porque um Waiver impropriamente
      documentado é violação de governança — não há modo de autorizar um Waiver
      que não satisfaz seus próprios requisitos de validade.
    primary_dimension: Operational
    secondary_dimensions: []
    category: Governance
    type: Completeness
    scope:
      - Waiver file
    execution_modes:
      - Async
      - Scheduled
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Waiver activation
    source_of_truth:
      - prodops/framework/journeys/diligence/model/waiver.md
    expected_condition: >
      Todo Waiver com status Active possui: approved_by (não vazio), approved_at
      (datetime válido), expires_at (data futura no momento da ativação), scope
      (descrição explícita do que está sendo dispensado), reason (justificativa
      documentada), risk_accepted (declaração explícita do risco), e pelo menos
      um evidence ID referenciado.
    failure_condition: >
      Um ou mais campos obrigatórios estão ausentes ou vazios em um Waiver com
      status Active: approved_by ausente, approved_at ausente, expires_at ausente
      ou inválido, scope vazio, reason vazio, risk_accepted vazio, ou nenhum
      evidence ID referenciado.
    warning_condition: ""
    not_applicable_condition: >
      O Waiver não está em status Active (Proposed, Approved, Expired, Revoked,
      Rejected ou Closed).
    indeterminate_condition: >
      Um campo está preenchido mas com valor placeholder ou template não
      substituído — requer revisão humana.
    error_condition: >
      O arquivo do Waiver não pôde ser lido.
    severity_default: Critical
    blocking: true
    blocking_scope:
      - Waiver Activation
    waiver_allowed: false
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Verificação de presença de cada campo obrigatório no front matter do Waiver
      - Lista de campos ausentes ou inválidos identificados
    subject_type:
      - Waiver
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Preencher todos os campos obrigatórios ausentes. Garantir que approved_by
      identifica o aprovador com autoridade. Verificar que evidence referencia
      EVD-YYYY-NNNN existente (ex: PR de aprovação). O Waiver só pode ser
      ativado após todos os campos estarem completos e válidos.
    escalation_targets:
      - Framework Owner
    notes: >
      waiver_allowed: false. Um Waiver mal documentado é violação de governança
      por definição — não pode ser autorizado por outro Waiver.

  - id: DIL-TMP-001
    version: 1
    status: Active
    name: "Expired Waiver Not Marked Active"
    description: >
      Verifica que qualquer Waiver cujo campo expires_at é uma data no passado
      (anterior à data atual) NÃO está com status Active. O status deve ser
      Expired, Revoked ou Closed. Waivers não se renovam automaticamente —
      expiração é automática por temporalidade mas o estado deve ser atualizado.
      Este check deve ser executado em varredura periódica (diligence-async).
      waiver_allowed: false porque renovação automática de Waiver viola a política
      de expiração — o propósito do expires_at é forçar nova decisão consciente.
    primary_dimension: Temporal
    secondary_dimensions: []
    category: Governance
    type: Freshness
    scope:
      - Waiver file
    execution_modes:
      - Async
      - Scheduled
    cycles:
      - diligence-async
    phases:
      - Scan
    capabilities:
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Periodic execution
    source_of_truth:
      - prodops/framework/journeys/diligence/model/waiver.md
    expected_condition: >
      Todo Waiver com expires_at no passado (expires_at < data atual) possui
      status Expired, Revoked ou Closed — nunca Active.
    failure_condition: >
      Um Waiver possui expires_at anterior à data atual E ainda está com
      status Active. O Waiver deveria ter transitado para Expired quando
      expires_at foi atingido.
    warning_condition: ""
    not_applicable_condition: >
      O Waiver possui expires_at no futuro (ainda válido) ou já está em
      status Expired, Revoked ou Closed.
    indeterminate_condition: >
      O campo expires_at está ausente ou não é uma data válida.
    error_condition: >
      O arquivo do Waiver não pôde ser lido ou a data atual não está disponível.
    severity_default: Critical
    blocking: true
    blocking_scope:
      - Waiver Activation
      - Promote
    waiver_allowed: false
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Valor do campo expires_at do Waiver
      - Data atual no momento da avaliação
      - Status atual do Waiver
    subject_type:
      - Waiver
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Atualizar o status do Waiver para Expired. Notificar o owner do Finding
      associado que o Waiver expirou e o Finding retorna ao fluxo normal
      (status: Acknowledged). Uma nova decisão consciente é necessária:
      nova Remediation ou novo Waiver com nova justificativa (novo ID).
      Nunca editar expires_at retroativamente para estender a validade.
    escalation_targets:
      - Framework Owner
      - Diligence Owner
    notes: >
      waiver_allowed: false. Tolerar Waiver expirado como Active viola a
      política de expiração obrigatória — é renovação automática disfarçada.

  - id: DIL-RDY-001
    version: 1
    status: Active
    name: "Reliability Plan Present When Conditionally Required"
    description: >
      Verifica que quando um OBC ou item satisfaz pelo menos uma das condições
      que tornam o Reliability Plan obrigatório — movimentação financeira,
      integração externa, mudança de SLO, risco alto ou crítico, mudança de
      persistência ou segurança — um Reliability Plan existe no path canônico.
      ESTE CHECK É NOT APPLICABLE e NÃO DEVE FALHAR quando nenhuma das condições
      de gatilho está presente. Não é gate universal para todos os OBCs.
    primary_dimension: Operational
    secondary_dimensions: []
    category: Readiness
    type: Readiness
    scope:
      - OBC file
      - Reliability Plan path
    execution_modes:
      - Sync
    cycles:
      - diligence-sync
    phases:
      - Promote
    capabilities:
      - Readiness Verification
    triggers:
      - Promote gate
      - Iteration Plan Entry gate
    source_of_truth:
      - prodops/framework/backlogs.md
      - prodops/framework/journeys/delivery/README.md
    expected_condition: >
      Quando o OBC possui pelo menos um dos gatilhos de obrigatoriedade
      (movimentação financeira, integração externa, mudança de SLO, risco
      alto/crítico, mudança de persistência ou segurança), um arquivo de
      Reliability Plan existe em prodops/artifacts/plans/reliability/ e
      referencia o OBC correspondente.
    failure_condition: >
      O OBC possui um ou mais gatilhos de obrigatoriedade E o Reliability Plan
      correspondente não existe no path canônico.
    warning_condition: ""
    not_applicable_condition: >
      O OBC não satisfaz nenhum dos gatilhos de obrigatoriedade do Reliability
      Plan. A ausência de Reliability Plan é o estado correto quando não há
      gatilho. Este Check DEVE retornar Not Applicable neste caso.
    indeterminate_condition: >
      Não é possível determinar se os gatilhos estão presentes sem revisão
      humana do OBC (ex: conteúdo ambíguo sobre movimentação financeira).
    error_condition: >
      O arquivo do OBC ou o diretório de Reliability Plans não pôde ser lido.
    severity_default: High
    blocking: true
    blocking_scope:
      - Promote
      - Iteration Plan Entry
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Flags de risco ou gatilhos documentados no OBC
      - Path do Reliability Plan esperado
      - Resultado da verificação de existência do Reliability Plan
      - Registro da decisão de Assessment se disponível
    subject_type:
      - Artifact
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on:
      - DIL-TRC-002
    remediation_hint: >
      Criar o Reliability Plan para o OBC qualificado. O Reliability Plan requer
      Assessment — não pode ser criado unilateralmente pela Diligence. Escalar
      para o Assessment com a evidência dos gatilhos identificados no OBC.
    escalation_targets:
      - Framework Owner
      - Assessment Owner
    notes: >
      Readiness e Workspace são categorias/escopos — não são dimensões canônicas
      adicionais. primary_dimension permanece Operational para checks de Readiness.

  - id: DIL-RDY-002
    version: 1
    status: Active
    name: "Promote Criteria Satisfied"
    description: >
      Verifica que todos os critérios necessários para promover um OBC ou Work
      Item para o próximo estado ou backlog são satisfeitos. O resultado DEVE
      enumerar exatamente quais critérios falharam — não apenas "falhou". Critérios
      incluem: OBC em estado correto, BDD Feature Committed quando necessário,
      Reliability Plan presente quando obrigatório, Findings bloqueantes ausentes
      ou com Waiver válido, campos obrigatórios preenchidos. Não se aplica quando
      nenhuma promoção está sendo tentada.
    primary_dimension: Operational
    secondary_dimensions: []
    category: Readiness
    type: Readiness
    scope:
      - OBC file
      - Work Item
    execution_modes:
      - Sync
    cycles:
      - diligence-sync
    phases:
      - Promote
    capabilities:
      - Readiness Verification
    triggers:
      - Promote gate
    source_of_truth:
      - prodops/framework/backlogs.md
      - prodops/framework/artifact-governance.md
    expected_condition: >
      Todos os critérios de promoção para o estado/backlog alvo estão satisfeitos:
      (1) OBC no estado pré-requisito correto, (2) BDD Feature Committed se
      requerido pelo estado alvo, (3) Reliability Plan presente se DIL-RDY-001
      resultou em Fail, (4) nenhum Finding bloqueante ativo sem Waiver válido,
      (5) campos obrigatórios do Work Item preenchidos.
    failure_condition: >
      Um ou mais critérios de promoção não estão satisfeitos. O Finding DEVE
      listar exatamente quais critérios falharam — não apenas "promoção bloqueada".
    warning_condition: ""
    not_applicable_condition: >
      Nenhuma promoção está sendo tentada para este OBC ou Work Item no momento.
    indeterminate_condition: >
      Não é possível determinar o estado atual de um ou mais critérios sem
      acesso a sistemas externos.
    error_condition: >
      Os arquivos ou sistemas necessários para avaliar os critérios não puderam
      ser acessados.
    severity_default: High
    blocking: true
    blocking_scope:
      - Promote
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Estado atual do OBC
      - Checklist de critérios de promoção com resultado pass/fail de cada critério
      - Lista de Findings bloqueantes ativos e status de seus Waivers
    subject_type:
      - Artifact
      - Work Item
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on:
      - DIL-TRC-001
      - DIL-RDY-001
    remediation_hint: >
      Resolver cada critério falhado individualmente antes de tentar nova
      promoção. Se BDD está faltando: criar BDD Feature. Se Reliability Plan
      está faltando: acionar Assessment. Se Findings bloqueantes existem: resolver
      ou obter Waiver. Reportar critério específico no Finding — não usar mensagem
      genérica de falha.
    escalation_targets:
      - Framework Owner
      - Product Owner
    notes: >
      Este Check deve especificar quais critérios falharam — Finding genérico
      de "promoção bloqueada" não é adequado.

  - id: DIL-WSP-001
    version: 1
    status: Active
    name: "Workspace Schema Conforms to Declared Configuration"
    description: >
      Verifica que a configuração do workspace GitHub (campos, labels, views)
      conforme declarado em manifest.yaml e nos documentos do framework corresponde
      ao estado real observado. Esta verificação é LIMITADA ao que já está
      canonicamente declarado — não inventa campos ou configurações futuras.
      Workspace Reconciliation é a Capability que executa a correção quando
      divergência é encontrada.
    primary_dimension: Structural
    secondary_dimensions:
      - Operational
    category: Workspace
    type: Conformance
    scope:
      - GitHub Project configuration
      - Labels
      - Fields
    execution_modes:
      - Async
      - Manual
    cycles:
      - diligence-async
    phases:
      - Scan
      - Inspect
    capabilities:
      - Workspace Reconciliation
      - Divergence Detection
    triggers:
      - Scheduled scan
      - Workspace change event
    source_of_truth:
      - prodops/exec/manifest.yaml
      - prodops/framework/journeys/diligence/workspace-reconciliation.md
    expected_condition: >
      Os campos, labels e views do GitHub Project correspondem exatamente ao
      que está declarado em manifest.yaml e na especificação canônica do
      workspace. Nenhum campo obrigatório ausente; nenhum label canônica faltando.
    failure_condition: >
      Um ou mais campos obrigatórios (artifact_type, artifact_id, operation,
      journey, execution_mode, owner) estão ausentes no GitHub Project, ou
      labels canônicas declaradas no manifest estão ausentes no repositório.
    warning_condition: ""
    not_applicable_condition: >
      O GitHub Project ainda não foi configurado para este produto (estado
      inicial antes de qualquer setup).
    indeterminate_condition: >
      A API do GitHub não está acessível ou as permissões não permitem listar
      campos e labels do projeto.
    error_condition: >
      A API do GitHub retornou erro ou as credenciais não estão disponíveis.
    severity_default: Medium
    blocking: false
    blocking_scope: []
    waiver_allowed: true
    auto_finding: true
    human_review_required: false
    evidence_required:
      - Configuração declarada no manifest.yaml (campos, labels esperados)
      - Configuração observada no workspace GitHub (saída de gh project field-list e gh label list)
    subject_type:
      - Workspace
    deduplication_key:
      - check_id
      - primary_subject
      - condition
      - scope
    depends_on: []
    remediation_hint: >
      Invocar a Capability Workspace Reconciliation para restaurar a configuração
      canônica. O ciclo Inspect → Reconcile → Verify deve ser executado conforme
      workspace-reconciliation.md. Não modificar configuração de workspace
      manualmente sem registrar o que foi alterado.
    escalation_targets:
      - Framework Owner
    notes: >
      Workspace é categoria/escopo — não é dimensão canônica adicional.
      primary_dimension é Structural. workspace-reconciliation é Capability,
      não Cycle.
