schema_version: 1

prodops_framework:
  version: "v1.14.0"
  status: ok
  source_repository: payments-api
  external_source: github.com/produtoreativo/prodops-framework
  synchronization_mechanism: ci-pr-sync
  note: >
    Este repositório compartilha ownership sobre a evolução do ProdOps Framework.
    Inovações nascem aqui e são promovidas upstream para produtoreativo/prodops-framework.
    Atualizações chegam via PR gerado por sync-from-framework.sh (manual)
    ou pelo workflow sync-prodops.yml (CI, acionado por notify-consumers.yml).

distribution:
  state: contributor
  lock_mode: framework-managed
  update_procedure: >
    Manual: bash prodops/scripts/sync-from-framework.sh
    CI: workflow_dispatch via notify-consumers.yml em prodops-framework

drift:
  status: ok
  installed_version: "v1.14.0"
  available_version: "v1.14.0"
  last_checked: "2026-08-16"
  reason: >
    Versão instalada igual à versão disponível — sem drift.
    Re-checar após nova release publicada em prodops-framework.
