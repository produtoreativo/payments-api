# ============================================================================
# ProdOps Exec Manifest — fonte única e legível por máquina do Framework
# ============================================================================
#
# Regras de uso:
#   1. Documentos em prosa REFERENCIAM valores deste arquivo — nunca os
#      reescrevem. Duplicação de pipeline, paths ou vocabulário em prosa é
#      considerada drift (ver prodops/scripts/validate-manifest.sh).
#   2. Agentes (Claude Code, Copilot, Codex) leem este arquivo em vez de
#      percorrer a cadeia de documentos do framework.
#   3. Scripts (doctor, hooks, CI) validam o repositório CONTRA este arquivo.
#
# Validação: ./prodops/scripts/validate-manifest.sh
# ============================================================================

version: 1

# O pipeline oficial do ProdOps Delivery (fonte: até então repetido em ~15 docs)
pipeline:
  ci_sync: [bootstrap, hack, sync, finish]
  ci_async: [ship, validate, promote]

# Skill executável de cada fase (invocável via /nome nos agentes)
skills:
  bootstrap: prodops/skills/bootstrap/SKILL.md
  hack: prodops/skills/hack/SKILL.md
  sync: prodops/skills/sync/SKILL.md
  finish: prodops/skills/finish/SKILL.md
  ship: prodops/skills/ship/SKILL.md
  validate: prodops/skills/validate/SKILL.md
  promote: prodops/skills/promote/SKILL.md
  upstream: prodops/skills/upstream/SKILL.md
  downstream: prodops/skills/downstream/SKILL.md

# Localizações canônicas dos artefatos (fonte: framework/canonical-paths.md)
paths:
  obcs: prodops/artifacts/obcs/
  bdd: prodops/artifacts/bdd/
  intents: prodops/artifacts/business-intents/
  product: prodops/artifacts/product/
  iteration_plan: prodops/artifacts/plans/iteration-plan.md
  release_trail: prodops/artifacts/trails/release-trail.md
  risks: prodops/artifacts/risks/risks.md
  reliability_plans: prodops/artifacts/plans/reliability/
  event_storming: prodops/artifacts/event-storming/plan.json
  architecture: prodops/artifacts/architecture/overview.md
    # guardrail: atualizar antes de fechar task quando houver novo módulo NestJS,
    # nova rota, dependência externa, tabela DynamoDB, tópico de evento ou fila SQS.
  experiments: prodops/artifacts/experiments/
  templates: prodops/templates/
  cards: prodops/artifacts/iterations/<version>/cards/ # optional — gerado pelo readiness do /downstream; escopo por iteração (<version> é placeholder)

# Quality gates verificáveis (comando + critério objetivo)
gates:
  lint:
    cmd: "cd api && npm run lint"
    expect: exit0
  # não há suites unitárias no repositório (jest em api/src encontra 0 testes
  # e sai com código 1) — o gate de testes é o acceptance abaixo
  acceptance:
    cmd: "./scripts/test-acceptance.sh"
    expect: exit0
    when: behavior_or_contract_changed
    note: "executa as 4 suítes de aceitação; requer LocalStack (CI: service container)"
  # gate de AUTO-MERGE, não de merge: um resultado vermelho impede que
  # `finish request` arme o `gh pr merge --auto`, mas o PR continua aberto e
  # mergeável à mão por um humano. Não é required status check — por isso não
  # aparece como job bloqueante em pr-gates.yml.
  coverage:
    cmd: "./scripts/check-coverage-threshold.sh"
    expect: exit0
    when: behavior_or_contract_changed
    metric: branches
    threshold_pct: 100
    blocks: auto_merge_only
    note: "consome o XML gerado pelo gate acceptance; cobertura atual 56.81% de branches — o auto-merge fica desarmado até atingir o limiar"

  build:
    cmd: "cd api && npm run build"
    expect: exit0
  # SCA (Software Composition Analysis) — vulnerabilidades conhecidas nas
  # dependências de terceiros. Não analisa o código-fonte: quem faz isso é
  # `code-analysis` (SonarQube local) e, no CI, o CodeQL (SAST remoto).
  # Gate de AUTO-MERGE, não de merge — mesmo desenho
  # do gate coverage: um resultado vermelho impede que `finish request` arme o
  # `gh pr merge --auto`, mas o PR continua aberto e mergeável à mão por um
  # humano. Não é required status check — por isso não aparece como job
  # bloqueante em pr-gates.yml.
  dependencies:
    cmd: "./scripts/check-dependencies.sh"
    expect: exit0
    tool: snyk
    severity_threshold: high
    requires_secret: SNYK_TOKEN
    blocks: auto_merge_only
    note: "sem SNYK_TOKEN o gate não roda e o auto-merge fica desarmado (motivo registrado no PR); o merge manual segue livre. Criar o secret é ação de admin — como allow_auto_merge."
  # Análise estática do código-fonte em api/src (SonarQube). Avalia
  # manutenibilidade, confiabilidade E segurança — não é um gate só de segurança,
  # por isso não se chama `sast`: SAST é um subconjunto do que o Sonar faz.
  # Complementa o gate `dependencies`, que é SCA (bibliotecas de terceiros).
  #
  # Roda LOCALMENTE via container SonarQube efêmero, no molde do LocalStack em
  # `acceptance`: falhar aqui custa menos que falhar na pipeline remota depois do
  # push. No CI o SAST remoto segue coberto pelo CodeQL (job
  # `Analyze (javascript-typescript)`) — não há job Sonar em pr-gates.yml, para
  # não ter duas ferramentas analisando o mesmo código-fonte.
  #
  # Gate de AUTO-MERGE, não de merge — mesmo desenho de coverage/dependencies:
  # um resultado vermelho impede que `finish request` arme o `gh pr merge --auto`,
  # mas o PR continua aberto e mergeável à mão por um humano.
  code-analysis:
    cmd: "./scripts/check-code-analysis.sh"
    expect: exit0
    tool: sonarqube
    project_key: payments-api
    blocks: auto_merge_only
    note: "servidor SonarQube efêmero em container; o script provisiona o token sozinho — não requer secret. Veredito lido da API (/api/qualitygates/project_status), não do exit code do scanner, que não é documentado. O script provisiona o quality gate 'prodops-code-analysis' (violations + duplicação + security hotspots) e remove a condição de cobertura que o SonarQube injeta via CAYC: cobertura é responsabilidade de gates.coverage, que é mais rigoroso (branches, 100%, código inteiro) que o new_coverage do Sonar (linhas, 80%, só código novo). Sem Docker o gate não roda (exit 2) e o auto-merge fica desarmado; o merge manual segue livre."
  no_mocks:
    # fonte: prodops/skills/hack/references/workflow.md (No Mocks Rule)
    # Aplica-se apenas a api/test/ (testes de aceitação devem usar implementações reais).
    # Unit tests em api/src/**/*.spec.ts podem usar jest.fn() para isolar dependências injetadas.
    grep: ["jest.fn(", ".mockReturnValue(", ".overrideProvider(", "jest.mock(", ".mockRejectedValue(", ".mockResolvedValue(", ".mockImplementation("]
    in: [api/test]
    expect: zero_hits
  smoke:
    # descritivo — mecânica em prodops/skills/local/payments-api-local-testing/
    cmd: "api/scripts/start-sandbox-api.sh && POST /invoices"
    expect: "201"
    when: bootstrap

# GitHub — Representação operacional canônica do Framework ProdOps
# GitHub Projects e Issues são a representação operacional canônica do ProdOps.
# Não existe abstração para outras ferramentas. Ferramentas externas são sync opcionais.
# Agentes: ler prodops/framework/knowledge-vs-execution.md para o modelo completo.
github:
  execution_space: true   # representa execução, não conhecimento
  # Declaração canônica: GitHub é a representação operacional do Framework ProdOps.
  canonical_operational_representation:
    tool: GitHub
    project_type: ProjectsV2
    work_item_type: Issue
    view_semantics: projeção canônica de Issues por Journey/Phase/Operation
    field_semantics: estado operacional necessário para projetar corretamente cada Work Item
    label_semantics: classificação auxiliar — nunca fonte de verdade para estado
    note: >
      GitHub Projects e Issues são a representação operacional canônica do
      Framework ProdOps. Não existe camada de abstração para outras ferramentas
      (Jira, Azure DevOps, Linear). Ferramentas externas são sincronizações
      opcionais — nunca equivalentes ou substitutos.
  # Work Items devem referenciar artefatos explicitamente (tipo + ID + operação)
  work_item_fields: [artifact_type, artifact_id, operation, journey, execution_mode, owner]
  # Domínios de gestão do trabalho via GitHub Projects
  projects:
    portfolio:
      tracks_work_on: [business_signals, business_intents]
      views: [business_signals, discovery, business_intent_backlog, roadmap, platform_releases, completed]
    product_repository:
      tracks_work_on: [business_intents, local_obcs, bdd, plans]
      views: [product_backlog, release_planning, current_iteration, doing, review, done, reliability, bugs]
  # Ferramentas externas são sync opcionais — nunca fonte de verdade
  optional_sync: [jira, azure_devops, linear]

# Execution Mapping — contrato declarativo artefato × operação × GitHub
execution_mapping:
  readme: prodops/framework/execution-mapping/README.md
  matrix: prodops/framework/execution-mapping/matrix.md
  work_item_schema: prodops/framework/execution-mapping/work-item-schema.md
  # Regra: ao criar Work Item, consultar a matriz para operações permitidas
  # e o schema para campos obrigatórios (artifact_type, artifact_id, operation, journey)

# Diligence — Persistência de entidades operacionais
# Convenções de armazenamento para Finding, Evidence, Remediation e Waiver.
# NÃO lista instâncias individuais — aponta para convenções e localização.
diligence:
  schema_version: "1.0"
  # Modelo canônico (schemas, estados, regras)
  model: prodops/framework/journeys/diligence/model/
  # Catálogo de Checks (definições normativas de regras)
  checks_catalog: prodops/framework/journeys/diligence/checks/
  checks_catalog_file: prodops/framework/journeys/diligence/checks/catalog.yaml
  checks_catalog_schema_version: 1
  checks_catalog_status: Active
  # Instâncias de entidades (Findings, Evidence, Remediations, Waivers)
  instances: prodops/artifacts/diligence/
  # Índice estruturado de entidades (não é fonte de verdade — é índice)
  registry: prodops/artifacts/diligence/registry.yaml
  # Templates para criação de instâncias
  templates: prodops/templates/diligence/
  # Política de IDs
  id_policy:
    finding:   "FND-YYYY-NNNN"
    evidence:  "EVD-YYYY-NNNN"
    remediation: "RMD-YYYY-NNNN"
    waiver:    "WVR-YYYY-NNNN"
    check:     "DIL-CATEGORY-NNN"
    immutable: true          # IDs nunca mudam após criação
    tool_independent: true   # IDs não dependem de números de GitHub Issue
  # Localização canônica por tipo de entidade
  paths:
    findings:     prodops/artifacts/diligence/findings/
    evidence:     prodops/artifacts/diligence/evidence/
    remediations: prodops/artifacts/diligence/remediations/
    waivers:      prodops/artifacts/diligence/waivers/
    reports:      prodops/artifacts/diligence/reports/
  # Referência para protocolo completo de IDs, deduplicação e aprovação
  # → prodops/artifacts/diligence/README.md
  github_workspace:
    specification: prodops/framework/journeys/diligence/github-workspace.md
    readiness: prodops/framework/journeys/diligence/github-workspace-readiness.md
    schema: prodops/framework/journeys/diligence/github-workspace-schema.yaml
    implementation_status: planned

# Vocabulário canônico (enums — corrige drift entre docs, skills e instâncias)
vocabulary:
  # fonte de verdade: hook commit-msg.sh (11 tipos)
  commit_types: [feat, fix, docs, test, refactor, perf, build, ci, style, chore, revert]
  commit_summary_max: 72
  # gate do move-to-downstream; experimentos legados usam variantes livres
  promotion_decision: ["Promover", "Promover com restrição", "Não promover", "Descartar"]
  iteration_status: ["Entrou", "Adiada", "Saiu"]
